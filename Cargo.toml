[package]
name = "embedded-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "defmt", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f303vc", "defmt", "time-driver-any", "exti"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async", "defmt-03"] }

[profile.dev]
opt-level = 1

[profile.release]
debug = 2
